// countsketch.proto — Portable wire format for Count Sketch state.
// Also contains TopKState and HeapEntry used by CountSketch and UnivMon.

syntax = "proto3";

package sketchlib.v1;

import "common/common.proto";

option go_package = "github.com/ProjectASAP/sketchlib-go/proto/countsketch;countsketchpb";

// ============================================================================
// Count Sketch
// ============================================================================

// CountSketchState is the portable state of a Count (±1) Sketch.
//
// The counter matrix is signed because Count Sketch uses ±1 increments.
// The matrix layout is identical to CountMinState (row-major, flat).
//
// L2 norms are derived values and must be recomputed on load:
//   l2[r] = sqrt( sum_c counts[r][c]^2 )
// Producers may include them as a convenience for consumers that only query.
message CountSketchState {
  // Matrix dimensions. Both must be > 0.
  uint32 rows = 1;
  uint32 cols = 2;

  // Indicates which counts_* field below is populated.
  CounterType counter_type = 3;

  // Signed integer counters in row-major order, length = rows * cols.
  // Populated when counter_type ∈ {INT32, INT64}.
  repeated sint64 counts_int = 4 [packed = true];

  // Floating-point counters in row-major order, length = rows * cols.
  // Populated when counter_type = FLOAT64 (Go producer).
  repeated double counts_float = 5 [packed = true];

  // Per-row L2 norms, length = rows. Derived — recompute on load if absent.
  repeated double l2 = 6 [packed = true];

  // Optional heavy-hitter (TopK min-heap) state.
  // Absent when TopK tracking is disabled.
  // Deprecated: use hh_keys (field 16) instead. Populated by old producers only.
  TopKState topk = 7;

  reserved 8 to 15;

  // Heavy-hitter candidate keys from the upstream Space-Saving tracker.
  // Downstream queries the CS matrix for each key to obtain merged estimates.
  // Replaces the stale upstream-local counts in topk.
  repeated string hh_keys = 16;
}

// ============================================================================
// TopK / Heavy-Hitter State
// ============================================================================

// TopKState is the serialized state of a min-heap heavy-hitter tracker.
message TopKState {
  // Maximum number of entries retained.
  uint32 k = 1;

  // All retained entries. Order is not guaranteed (heap order is not preserved).
  repeated HeapEntry entries = 2;
}

// HeapEntry is one heavy-hitter record inside a TopKState.
message HeapEntry {
  // String key identifying the heavy hitter (e.g. flow ID, IP address).
  // For binary keys, producers should use base64 or hex encoding and document
  // their choice; a future bytes_key field is reserved at number 3.
  string key = 1;

  // Approximate frequency or weight accumulated for this key.
  double count = 2;

  reserved 3;  // Reserved for bytes_key alternative.
}

// ============================================================================
// CountSketch Delta
// ============================================================================

// CountSketchDelta for the signed Count array. TopK is non-linear (cannot be
// subtracted), so it is always transmitted in full using the existing TopKState.
message CountSketchDelta {
  uint32                   rows          = 1;
  uint32                   cols          = 2;
  // Deprecated: use cell_rows/cell_cols/d_counts instead.
  // Kept for backward-compat deserialization from old producers.
  repeated CountSketchCell cells_legacy  = 3;
  // Deprecated: use l2 (field 12) instead.
  repeated double          l2_legacy     = 4 [packed = true];
  // Deprecated: use hh_keys (field 6) instead.
  TopKState                topk          = 5;
  // Heavy-hitter candidate keys from the upstream Space-Saving tracker.
  // Downstream queries the merged CS accumulator for each key to build TopK.
  repeated string          hh_keys       = 6;
  // New packed encoding (Opt-2, Stage 2):
  repeated uint32          cell_rows     = 9  [packed = true];  // row index of each changed cell
  repeated uint32          cell_cols     = 10 [packed = true];  // col index of each changed cell
  repeated sint64          d_counts      = 11 [packed = true];  // signed integer count delta
  repeated double          l2            = 12 [packed = true];  // per-row L2 norm deltas
}

// CountSketchCell is kept for backward-compat deserialization only.
// New producers must write to CountSketchDelta's packed arrays instead.
message CountSketchCell {
  uint32 row     = 1;
  uint32 col     = 2;
  double d_count = 3;  // deprecated: use CountSketchDelta.d_counts
}
